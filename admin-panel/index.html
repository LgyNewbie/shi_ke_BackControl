<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据统计</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'dashboard', title: '数据统计' }, async (body, ctx) => {
  const { esc, yuan, num } = Admin;
  ctx.setActions('<button class="btn ghost" id="reloadBtn">刷新</button>');
  document.getElementById('reloadBtn').onclick = () => load();

  async function load() {
    const s = await Admin.api('/api/admin/stats');
    const todo = s.todo || {};
    const daily = (s.daily || []).slice().sort((a, b) => String(a.day).localeCompare(String(b.day)));
    const maxRev = Math.max(1, ...daily.map(d => Number(d.revenue) || 0));
    const maxOrd = Math.max(1, ...daily.map(d => Number(d.orders) || 0));
    const dist = (s.status_distribution || []).filter(x => x.count > 0);
    const maxDist = Math.max(1, ...dist.map(x => x.count));
    const tops = s.top_foods || [];
    const maxTop = Math.max(1, ...tops.map(x => x.sales));

    const card = (label, n, sub, cls, href) =>
      `<div class="stat ${cls || ''} ${href ? 'link' : ''}" ${href ? `data-href="${href}"` : ''}><div class="num">${n}</div><div class="label">${label}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
    const sub = (p) => `营业额 ${yuan(p.revenue)}`;
    const bars = (key, max, fmt) => daily.length ? `<div class="bars">${daily.map(d => {
      const v = Number(d[key]) || 0;
      return `<div class="bar-col"><div class="bar-val">${fmt(v)}</div><div class="bar" style="height:${Math.round(v / max * 120)}px"></div><div class="bar-label">${esc(String(d.day).slice(5))}</div></div>`;
    }).join('')}</div>` : '<div class="empty-state">暂无数据</div>';

    body.innerHTML = `
      <h3 style="margin:0 0 10px">待办事项</h3>
      <div class="stat-grid">
        ${card('待接单', num(todo.wait_accept), '点击去处理', todo.wait_accept ? 'warn' : '', 'orders.html?status=paid')}
        ${card('已接单 / 制作中', num(todo.cooking), '点击查看', '', 'orders.html?status=accepted')}
        ${card('配送中', num(todo.delivering), '', '', 'orders.html?status=delivery')}
        ${card('待审核退款', num(todo.pending_refunds), '', todo.pending_refunds ? 'warn' : '', 'refunds.html')}
        ${card('待处理投诉', num(todo.pending_complaints), '', todo.pending_complaints ? 'warn' : '', 'complaints.html')}
      </div>
      <h3 style="margin:0 0 10px">经营数据</h3>
      <div class="stat-grid">
        ${card('今日订单', num(s.today.orders), sub(s.today))}
        ${card('近 7 天订单', num(s.week.orders), sub(s.week))}
        ${card('近 30 天订单', num(s.month.orders), sub(s.month))}
        ${card('累计订单', num(s.total.orders), sub(s.total))}
        ${card('用户总数', num(s.users.total), `今日新增 ${num(s.users.today_new)}`)}
        ${card('钱包余额总额', yuan(s.wallet_total), '平台应付用户余额')}
      </div>
      <div class="grid-2">
        <div class="card"><h3>近期营业额（元）</h3>${bars('revenue', maxRev, v => v.toFixed(v % 1 ? 1 : 0))}</div>
        <div class="card"><h3>近期订单数</h3>${bars('orders', maxOrd, v => v)}</div>
      </div>
      <div class="grid-2">
        <div class="card"><h3>热销菜品 TOP</h3>${tops.length ? tops.map(t => `
          <div class="hbar"><div class="name" title="${esc(t.name)}">${esc(t.name)}</div><div class="track"><div class="fill" style="width:${t.sales / maxTop * 100}%"></div></div><div class="val">${num(t.sales)} 份</div></div>`).join('') : '<div class="empty-state">暂无销量数据</div>'}
          <div style="text-align:right"><a href="foods.html">查看销量排行 →</a></div></div>
        <div class="card"><h3>订单状态分布</h3>${dist.length ? dist.map(t => `
          <div class="hbar"><div class="name">${esc(t.text)}</div><div class="track"><div class="fill" style="width:${t.count / maxDist * 100}%"></div></div><div class="val">${num(t.count)}</div></div>`).join('') : '<div class="empty-state">暂无订单</div>'}</div>
      </div>`;
    Admin.$$('[data-href]', body).forEach(el => el.onclick = () => { location.href = el.dataset.href; });
  }
  await load();
});
</script>
</body>
</html>
