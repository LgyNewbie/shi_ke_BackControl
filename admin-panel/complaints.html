<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户投诉</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'complaints', title: '客户投诉' }, async (main) => {
  const { api, act, esc, yuan, badge, modal, confirmBox, formBox, renderPager, debounce, $ } = Admin;
  const state = { page: 1, pageSize: 15, total: 0, keyword: '', status: '' };
  let rows = [];
  const ST = { pending: ['待处理', 'orange'], processing: ['处理中', 'blue'], resolved: ['已解决', 'green'], rejected: ['已驳回', 'gray'] };
  const stBadge = (s) => badge((ST[s] || [s])[0], (ST[s] || [])[1]);

  main.innerHTML = `
    <div class="toolbar">
      <input type="search" id="kw" placeholder="搜索投诉内容 / 昵称 / 账号 / 订单号">
      <select id="st"><option value="">全部状态</option>${Object.entries(ST).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select>
      <button class="btn ghost" id="reload">刷新</button>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>ID</th><th>用户</th><th>订单</th><th>类型</th><th>内容</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div id="pager"></div>`;

  const short = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };

  async function load() {
    const res = await api('/api/complaints/admin/list', { raw: true, query: { page: state.page, pageSize: state.pageSize, keyword: state.keyword, status: state.status } });
    rows = res.data || [];
    state.total = res.total || 0;
    $('#tb').innerHTML = rows.length ? rows.map((c) => `
      <tr>
        <td>${c.id}</td>
        <td>${esc(c.nickname || c.dev_account || '用户')}<div class="muted sm-text">#${c.user_id}</div></td>
        <td class="mono">${esc(c.order_no || '-')}</td>
        <td>${esc(c.type || '-')}</td>
        <td style="max-width:300px"><div class="ellipsis" style="max-width:300px" title="${esc(c.content)}">${esc(short(c.content, 50))}</div>
          ${c.images.length ? `<span class="muted sm-text">📷 ${c.images.length} 张图</span>` : ''}</td>
        <td>${stBadge(c.status)}${c.refund_id ? '<div class="sm-text muted">已关联退款 #' + c.refund_id + '</div>' : ''}</td>
        <td class="sm-text">${esc(c.created_at)}</td>
        <td><div class="row-actions">
          <button class="btn sm ghost" data-act="detail" data-id="${c.id}">详情</button>
          ${c.status === 'pending' || c.status === 'processing' ? `<button class="btn sm blue" data-act="handle" data-id="${c.id}">处理</button>` : ''}
          ${c.order_id && !c.refund_id ? `<button class="btn sm warn" data-act="refund" data-id="${c.id}">发起退款</button>` : ''}
          ${c.status === 'resolved' || c.status === 'rejected' ? `<button class="btn sm danger" data-act="del" data-id="${c.id}">删除</button>` : ''}
        </div></td></tr>`).join('') : '<tr><td colspan="8" class="empty-state">暂无投诉记录</td></tr>';
    renderPager($('#pager'), state, (p) => { state.page = p; load(); });
  }

  function detail(c) {
    const html = `
      <div class="detail-section"><dl class="kv">
        <dt>用户</dt><dd>${esc(c.nickname || c.dev_account || '')} #${c.user_id}</dd>
        <dt>关联订单</dt><dd>${c.order_no ? esc(c.order_no) + '（' + yuan(c.order_amount) + '，可退 ' + yuan(c.refundable) + '）' : '无'}</dd>
        <dt>类型</dt><dd>${esc(c.type || '-')}</dd>
        <dt>状态</dt><dd>${stBadge(c.status)}</dd>
        <dt>提交时间</dt><dd>${esc(c.created_at)}</dd>
        <dt>处理人</dt><dd>${esc(c.handler || '-')}</dd>
        <dt>处理备注</dt><dd class="pre">${esc(c.handle_remark || '-')}</dd>
        <dt>退款单</dt><dd>${c.refund_id ? '#' + c.refund_id : '-'}</dd>
      </dl></div>
      <div class="detail-section"><h4>投诉内容</h4><div class="pre">${esc(c.content)}</div></div>
      ${c.images.length ? `<div class="detail-section"><h4>图片</h4><div class="img-row">${c.images.map((u) => `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" alt=""></a>`).join('')}</div></div>` : ''}`;
    modal({ title: `投诉详情 #${c.id}`, width: 600, body: html, buttons: [{ text: '关闭', type: 'ghost' }] });
  }

  async function handle(c) {
    const r = await formBox({
      title: `处理投诉 #${c.id}`, okText: '提交', width: 480,
      fields: [
        { name: 'status', label: '处理结果', type: 'select', value: c.status === 'pending' ? 'processing' : c.status,
          options: [{ value: 'processing', text: '处理中' }, { value: 'resolved', text: '已解决' }, { value: 'rejected', text: '驳回' }] },
        { name: 'remark', label: '处理备注 / 回复', type: 'textarea', rows: 4, full: true, value: c.handle_remark, maxlength: 300 }
      ],
      submit: (v) => act(`/api/complaints/admin/${c.id}/handle`, 'POST', { status: v.status, handle_remark: v.remark })
    });
    if (r) load();
  }

  async function refund(c) {
    const max = c.refundable;
    const r = await formBox({
      title: `为投诉 #${c.id} 发起退款`, okText: '创建退款单', width: 480,
      fields: [
        { name: 'amount', label: '退款金额（元）', type: 'number', step: '0.01', min: 0.01, required: true, value: max > 0 ? max : '', hint: `订单 ${c.order_no || ''} 剩余可退 ${yuan(max)}。创建后需到「退款审核」审核放款` },
        { name: 'reason', label: '退款原因', type: 'textarea', rows: 3, full: true, value: `投诉#${c.id}处理` }
      ],
      validate: (v) => { const a = Number(v.amount); if (!(a > 0)) return '金额不合法'; if (a > max + 1e-9) return `不能超过可退金额 ${yuan(max)}`; },
      submit: (v) => act('/api/refunds/admin/create', 'POST', { userId: c.user_id, orderId: c.order_id, complaintId: c.id, amount: Number(v.amount), reason: v.reason })
    });
    if (r) load();
  }

  $('#tb').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const c = rows.find((x) => x.id === Number(b.dataset.id));
    if (!c) return;
    const a = b.dataset.act;
    if (a === 'detail') detail(c);
    else if (a === 'handle') handle(c);
    else if (a === 'refund') refund(c);
    else if (a === 'del') {
      const ok = await confirmBox({ title: '删除投诉', message: `确定删除投诉 #${c.id} 吗？无法恢复。`, danger: true, okText: '确认删除' });
      if (ok) { await act(`/api/complaints/admin/${c.id}`, 'DELETE'); load(); }
    }
  });
  $('#kw').addEventListener('input', debounce((e) => { state.keyword = e.target.value.trim(); state.page = 1; load(); }, 350));
  $('#st').addEventListener('change', (e) => { state.status = e.target.value; state.page = 1; load(); });
  $('#reload').addEventListener('click', load);
  await load();
});
</script>
</body>
</html>
