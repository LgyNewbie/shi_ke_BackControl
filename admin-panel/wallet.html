<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钱包管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'wallet', title: '钱包管理' }, async (body) => {
  const { api, act, esc, yuan, badge, modal, confirmBox, formBox, renderPager, debounce } = Admin;
  const BASE = '/api/wallet/admin';
  const st = { keyword: '', page: 1, pageSize: 20, rows: [] };

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num" id="totalBal">-</div><div class="label">全部用户钱包余额合计</div><div class="sub">这部分是商家欠用户的「可用于下单的余额」</div></div>
    </div>
    <div class="toolbar">
      <input type="text" id="kw" placeholder="搜索用户昵称 / 账号">
      <button class="btn ghost" id="reload">刷新</button>
    </div>
    <div class="card" style="padding:0"><div class="table-wrap" id="tbl"></div></div>
    <div id="pager"></div>`;
  Admin.$('#kw').addEventListener('input', debounce((e) => { st.keyword = e.target.value.trim(); st.page = 1; load(); }, 300));
  Admin.$('#reload').addEventListener('click', load);

  async function load() {
    const r = await api(BASE + '/overview', { query: { keyword: st.keyword, page: st.page, pageSize: st.pageSize }, raw: true });
    st.rows = r.data;
    Admin.$('#totalBal').textContent = yuan(r.total_balance);
    const tbl = Admin.$('#tbl');
    if (!st.rows.length) { tbl.innerHTML = '<div class="empty-state">没有符合条件的用户</div>'; Admin.$('#pager').innerHTML = ''; return; }
    tbl.innerHTML = `<table class="tbl"><thead><tr><th>用户ID</th><th>用户</th><th>钱包余额</th><th>最近变动</th><th>操作</th></tr></thead><tbody>
      ${st.rows.map((u) => `<tr>
        <td class="muted">#${u.user_id}</td>
        <td>${esc(u.nickname || '(未设置昵称)')}<div class="sm-text muted">${esc(u.dev_account || '')}</div></td>
        <td><b>${yuan(u.balance)}</b></td>
        <td class="sm-text muted">${esc(u.updated_at || '-')}</td>
        <td><div class="row-actions">
          <button class="btn sm blue" data-a="tx" data-id="${u.user_id}">查看流水</button>
          <button class="btn sm warn" data-a="adj" data-id="${u.user_id}">调整余额</button>
        </div></td></tr>`).join('')}</tbody></table>`;
    Admin.$$('[data-a]', tbl).forEach((b) => b.addEventListener('click', () => {
      const u = st.rows.find((x) => x.user_id === Number(b.dataset.id));
      (b.dataset.a === 'tx' ? showTx : adjust)(u);
    }));
    renderPager(Admin.$('#pager'), { page: st.page, pageSize: st.pageSize, total: r.total }, (p) => { st.page = p; load(); });
  }

  async function showTx(u) {
    const d = await api(`${BASE}/user/${u.user_id}`);
    const rows = d.transactions;
    modal({
      title: `钱包流水：${u.nickname || u.dev_account || '用户#' + u.user_id}（当前余额 ${yuan(d.wallet ? d.wallet.balance : 0)}）`,
      width: 760,
      body: rows.length ? `<div class="table-wrap" style="box-shadow:none;max-height:60vh;overflow:auto"><table class="tbl"><thead><tr><th>时间</th><th>类型</th><th>变动</th><th>变动后余额</th><th>关联订单</th><th>备注</th></tr></thead><tbody>
        ${rows.map((t) => `<tr><td class="sm-text">${esc(t.created_at)}</td><td>${badge(t.type_text, t.amount >= 0 ? 'green' : 'orange')}</td>
          <td><b style="color:${t.amount >= 0 ? '#11794f' : '#b42318'}">${t.amount >= 0 ? '+' : '-'}${yuan(Math.abs(t.amount))}</b></td>
          <td>${yuan(t.balance_after)}</td><td class="sm-text">${t.order_id ? '#' + t.order_id : '-'}</td><td class="sm-text">${esc(t.remark || '-')}</td></tr>`).join('')}
        </tbody></table></div><div class="sm-text muted" style="margin-top:8px">最多显示最近 200 条</div>` : '<div class="empty-state">暂无流水</div>',
      buttons: [{ text: '关闭', type: 'ghost' }]
    });
  }

  async function adjust(u) {
    const v = await formBox({
      title: `调整余额：${u.nickname || u.dev_account || '用户#' + u.user_id}`, width: 460, okText: '下一步：确认',
      fields: [
        { name: 'amount', label: '调整金额（元）', type: 'number', step: '0.01', required: true, full: true, hint: `当前余额 ${yuan(u.balance)}。正数为增加，负数为扣减，如 -10 表示扣 10 元。` },
        { name: 'remark', label: '调整原因', type: 'textarea', required: true, full: true, maxlength: 100, placeholder: '如：客诉补偿 / 活动赠送 / 更正错误' }
      ],
      validate: (x) => {
        const a = Number(x.amount);
        if (!Number.isFinite(a) || a === 0) return '请填写不为 0 的金额';
        if (a < 0 && u.balance + a < -1e-9) return '扣减后余额不能为负数';
        return '';
      }
    });
    if (!v) return;
    const a = Math.round(Number(v.amount) * 100) / 100;
    const ok = await confirmBox({
      title: '确认调整余额',
      message: `将${a > 0 ? '增加' : '扣减'}「${u.nickname || '用户#' + u.user_id}」钱包 ${yuan(Math.abs(a))}\n调整后余额：${yuan(u.balance + a)}\n原因：${v.remark}\n此操作会留痕并记入操作日志。`,
      danger: a < 0, okText: '确认调整'
    });
    if (!ok) return;
    try { await act(`${BASE}/manual-adjust`, 'POST', { userId: u.user_id, amount: a, remark: v.remark }, '余额已调整'); } catch (e) { return; }
    load();
  }

  await load();
});
</script>
</body>
</html>
