<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钱包/用户</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="loginBox" class="login-box">
    <h2>管理后台登录</h2>
    <input id="loginUsername" placeholder="用户名" value="admin">
    <input id="loginPassword" placeholder="密码" type="password">
    <button onclick="doLogin()">登录</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="mainBox" style="display:none;">
    <header>
      <h1>小程序运营后台</h1>
      <div><span id="whoami"></span> <button class="ghost" onclick="logout()">退出登录</button></div>
    </header>
    <nav>
      <a href="index.html">总览</a>
      <a href="orders.html">订单管理</a>
      <a href="coupons.html">优惠券</a>
      <a href="complaints.html">客户投诉</a>
      <a href="refunds.html">退款审核</a>
      <a href="wallet.html" class="active">钱包/用户</a>
    </nav>
    <main>
      <div class="section">
        <h3>用户列表</h3>
        <table>
          <thead><tr><th>ID</th><th>昵称</th><th>账号标识</th><th>状态</th><th>钱包余额</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>

      <div class="section" id="txSection" style="display:none;">
        <h3>流水明细 <span id="txTitle" style="font-weight:normal;color:#999;font-size:13px;"></span></h3>
        <table>
          <thead><tr><th>ID</th><th>类型</th><th>金额</th><th>变动后余额</th><th>关联订单</th><th>备注</th><th>时间</th></tr></thead>
          <tbody id="txTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<script src="app.js"></script>
<script>
async function loadUsers() {
  const list = await api('/api/admin/users');
  const tbody = document.getElementById('userTableBody');
  tbody.innerHTML = list.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${u.nickname || '-'}</td>
      <td>${u.dev_account || u.openid || '-'}</td>
      <td>${u.status}</td>
      <td>¥${fenToYuan(u.balance)}</td>
      <td>${u.created_at}</td>
      <td>
        <button onclick="viewTx(${u.id}, '${u.nickname || u.dev_account || u.id}')">查看流水</button>
        <button class="gray" onclick="adjustBalance(${u.id})">手动调整余额</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="7" style="color:#999;">暂无用户</td></tr>';
}

async function viewTx(userId, label) {
  document.getElementById('txSection').style.display = 'block';
  document.getElementById('txTitle').textContent = `—— ${label}`;
  const data = await api(`/api/wallet/admin/user/${userId}`);
  const tbody = document.getElementById('txTableBody');
  tbody.innerHTML = data.transactions.map(t => `
    <tr>
      <td>${t.id}</td>
      <td>${t.type}</td>
      <td style="color:${t.amount >= 0 ? '#0f5132' : '#842029'}">${t.amount >= 0 ? '+' : ''}${fenToYuan(t.amount)}</td>
      <td>¥${fenToYuan(t.balance_after)}</td>
      <td>${t.order_id || '-'}</td>
      <td>${t.remark || '-'}</td>
      <td>${t.created_at}</td>
    </tr>
  `).join('') || '<tr><td colspan="7" style="color:#999;">暂无流水</td></tr>';
}

async function adjustBalance(userId) {
  const amountYuan = prompt('调整金额（元），正数为加，负数为减，如 -10 表示扣10元：');
  if (!amountYuan) return;
  const amount = Math.round(parseFloat(amountYuan) * 100);
  if (!amount) { alert('金额不合法'); return; }
  const remark = prompt('调整原因：') || '';
  await api('/api/wallet/admin/manual-adjust', { method: 'POST', body: { userId, amount, remark } });
  loadUsers();
}

initPage(loadUsers);
</script>
</body>
</html>
