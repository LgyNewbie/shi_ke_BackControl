<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'users', title: '用户管理' }, async (main) => {
  const { api, act, esc, yuan, badge, modal, confirmBox, renderPager, debounce, $ } = Admin;
  const state = { page: 1, pageSize: 20, total: 0, keyword: '', status: '' };
  let rows = [];

  main.innerHTML = `
    <div class="toolbar">
      <input type="search" id="kw" placeholder="搜索昵称 / 账号 / 手机号 / 用户ID">
      <select id="st">
        <option value="">全部状态</option>
        <option value="normal">正常</option>
        <option value="blocked">已禁用</option>
      </select>
      <button class="btn ghost" id="reload">刷新</button>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>用户</th><th>手机号</th><th class="num">订单数</th><th class="num">累计消费</th>
          <th class="num">钱包余额</th><th class="num">可用券</th><th>状态</th><th>注册 / 最近登录</th><th>操作</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div id="pager"></div>`;

  const avatar = (u) => u.avatar
    ? `<img class="thumb" style="border-radius:50%" src="${esc(u.avatar)}" alt="">`
    : `<div class="thumb" style="border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px">👤</div>`;

  async function load() {
    const res = await api('/api/admin/users', {
      raw: true,
      query: { page: state.page, pageSize: state.pageSize, keyword: state.keyword, status: state.status }
    });
    rows = res.data || [];
    state.total = res.total || 0;
    const tb = $('#tb');
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="9" class="empty-state">没有符合条件的用户</td></tr>';
    } else {
      tb.innerHTML = rows.map((u) => `
        <tr>
          <td><div class="cell-food">${avatar(u)}<div>
            <div class="name">${esc(u.nickname || '未命名')} <span class="muted sm-text">#${u.id}</span></div>
            <div class="muted sm-text">${esc(u.dev_account || '')}</div></div></div></td>
          <td>${esc(u.phone || '-')}</td>
          <td class="num">${u.order_count}</td>
          <td class="num">${yuan(u.spent)}</td>
          <td class="num">${yuan(u.balance)}</td>
          <td class="num">${u.coupon_count}</td>
          <td>${u.status === 'blocked' ? badge('已禁用', 'red') : badge('正常', 'green')}</td>
          <td class="sm-text">${esc(u.created_at || '')}<br><span class="muted">${esc(u.last_login_at || '从未登录')}</span></td>
          <td><div class="row-actions">
            <button class="btn sm ghost" data-act="detail" data-id="${u.id}">详情</button>
            ${u.status === 'blocked'
              ? `<button class="btn sm primary" data-act="unblock" data-id="${u.id}">恢复</button>`
              : `<button class="btn sm danger" data-act="block" data-id="${u.id}">禁用</button>`}
          </div></td>
        </tr>`).join('');
    }
    renderPager($('#pager'), state, (p) => { state.page = p; load(); });
  }

  async function toggleStatus(u, block) {
    const name = u.nickname || ('#' + u.id);
    const ok = await confirmBox({
      title: block ? '禁用用户' : '恢复用户',
      message: block
        ? `确定禁用用户「${name}」吗？\n禁用后该用户不能登录和下单。`
        : `确定恢复用户「${name}」吗？恢复后可正常登录和下单。`,
      danger: block, okText: block ? '确认禁用' : '确认恢复'
    });
    if (!ok) return false;
    await act(`/api/admin/users/${u.id}/status`, 'POST', { status: block ? 'blocked' : 'normal' });
    load();
    return true;
  }

  async function showDetail(id) {
    const [d, w, cps] = await Promise.all([
      api(`/api/admin/users/${id}/detail`),
      api(`/api/wallet/admin/user/${id}`, { silent: true }).catch(() => null),
      api(`/api/coupons/admin/user/${id}`, { silent: true }).catch(() => [])
    ]);
    const u = d.user;
    const cpList = Array.isArray(cps) ? cps : [];
    const unused = cpList.filter((c) => c.status === 'unused').length;
    const cpColor = { unused: 'green', locked: 'orange', used: 'gray', revoked: 'red', expired: 'gray' };
    const txs = (w && w.transactions || []).slice(0, 8);

    const html = `
      <div class="detail-section">
        <div class="cell-food">${avatar(u)}<div>
          <div class="name">${esc(u.nickname || '未命名')} ${u.status === 'blocked' ? badge('已禁用', 'red') : badge('正常', 'green')}</div>
          <div class="muted sm-text">ID ${u.id} · ${esc(u.dev_account || '')}</div></div></div>
      </div>
      <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">
        <div class="stat"><div class="num" style="font-size:20px">${d.orderCount}</div><div class="label">订单数</div></div>
        <div class="stat"><div class="num" style="font-size:20px">${yuan(d.spent)}</div><div class="label">累计消费</div></div>
        <div class="stat"><div class="num" style="font-size:20px">${yuan(d.wallet.balance)}</div><div class="label">钱包余额</div></div>
        <div class="stat"><div class="num" style="font-size:20px">${unused}</div><div class="label">可用优惠券</div></div>
        <div class="stat"><div class="num" style="font-size:20px">${d.complaintCount}</div><div class="label">投诉</div></div>
        <div class="stat"><div class="num" style="font-size:20px">${d.messageCount}</div><div class="label">留言</div></div>
      </div>
      <div class="detail-section"><h4>基本信息</h4>
        <dl class="kv">
          <dt>手机号</dt><dd>${esc(u.phone || '-')}</dd>
          <dt>注册时间</dt><dd>${esc(u.created_at || '-')}</dd>
          <dt>最近登录</dt><dd>${esc(u.last_login_at || '-')}</dd>
          <dt>收藏数</dt><dd>${d.favoriteCount}</dd>
        </dl></div>
      <div class="detail-section"><h4>收货地址（${d.addresses.length}）</h4>
        ${d.addresses.length ? d.addresses.map((a) => `<div class="sm-text" style="padding:3px 0">${a.is_default ? badge('默认', 'blue') + ' ' : ''}${esc(a.name || '')} ${esc(a.phone || '')} · ${esc(a.area_name || '')} ${esc(a.detail || '')}</div>`).join('') : '<div class="muted">暂无</div>'}
      </div>
      <div class="detail-section"><h4>钱包流水（最近 ${txs.length} 条）</h4>
        ${txs.length ? `<table class="tbl" style="min-width:0"><tbody>${txs.map((t) => `<tr>
          <td>${esc(t.type_text || t.type)}</td><td class="num" style="color:${t.amount < 0 ? 'var(--red)' : 'var(--green)'}">${t.amount > 0 ? '+' : ''}${Number(t.amount).toFixed(2)}</td>
          <td class="muted sm-text">${esc(t.remark || '')}</td><td class="muted sm-text">${esc(t.created_at || '')}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">暂无流水</div>'}
      </div>
      <div class="detail-section"><h4>优惠券（共 ${cpList.length} 张，可用 ${unused} 张）</h4>
        ${cpList.length ? `<table class="tbl" style="min-width:0"><tbody>${cpList.slice(0, 20).map((c) => `<tr>
          <td>${esc(c.name)}</td><td>${badge(c.status_text || c.status, cpColor[c.status])}</td>
          <td class="muted sm-text">${c.status === 'unused' || c.status === 'locked' ? '到期 ' : ''}${esc(c.expire_at || '')}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">暂无优惠券</div>'}
      </div>
      <div class="detail-section"><h4>最近订单（${d.orders.length}）</h4>
        ${d.orders.length ? `<table class="tbl" style="min-width:0"><tbody>${d.orders.map((o) => `<tr>
          <td class="mono">${esc(o.order_no)}</td><td class="ellipsis">${esc(o.title || '')}</td>
          <td class="num">${yuan(o.amount)}</td><td>${badge(o.status_text, Admin.ORDER_COLORS[o.status])}</td>
          <td class="muted sm-text">${esc(o.created_at)}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">暂无订单</div>'}
      </div>`;

    modal({
      title: `用户详情 #${u.id}`, width: 720, body: html,
      buttons: [
        { text: '关闭', type: 'ghost' },
        {
          text: u.status === 'blocked' ? '恢复用户' : '禁用用户',
          type: u.status === 'blocked' ? 'primary' : 'danger',
          onClick: async () => { const done = await toggleStatus(u, u.status !== 'blocked'); return done ? undefined : false; }
        }
      ]
    });
  }

  $('#tb').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = Number(b.dataset.id);
    const u = rows.find((x) => x.id === id);
    if (b.dataset.act === 'detail') showDetail(id);
    else if (u) toggleStatus(u, b.dataset.act === 'block');
  });
  $('#kw').addEventListener('input', debounce((e) => { state.keyword = e.target.value.trim(); state.page = 1; load(); }, 350));
  $('#st').addEventListener('change', (e) => { state.status = e.target.value; state.page = 1; load(); });
  $('#reload').addEventListener('click', load);
  await load();
});
</script>
</body>
</html>
