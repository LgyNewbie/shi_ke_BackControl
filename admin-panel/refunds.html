<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退款审核</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'refunds', title: '退款审核' }, async (body, ctx) => {
  const { api, act, esc, yuan, badge, confirmBox, formBox, renderPager, debounce, toast } = Admin;
  const BASE = '/api/refunds/admin';
  const STATUS = { pending_review: ['待审核', 'orange'], completed: ['已退款', 'green'], rejected: ['已拒绝', 'gray'] };
  const st = { status: 'pending_review', keyword: '', page: 1, pageSize: 20, rows: [] };

  body.innerHTML = `
    <div class="tabs" id="tabs">
      <button class="tab active" data-s="pending_review">待审核<span class="cnt" id="pendCnt">0</span></button>
      <button class="tab" data-s="">全部记录</button>
      <button class="tab" data-s="completed">已退款</button>
      <button class="tab" data-s="rejected">已拒绝</button>
    </div>
    <div class="tip info">审核通过后，退款金额会退回到用户的站内钱包（尚未接入微信支付退款）。通过时可修改退款金额，金额小于申请金额即为部分退款。</div>
    <div class="toolbar">
      <input type="text" id="kw" placeholder="搜索用户昵称 / 账号 / 订单号 / 原因">
      <button class="btn ghost" id="reload">刷新</button>
    </div>
    <div class="card" style="padding:0"><div class="table-wrap" id="tbl"></div></div>
    <div id="pager"></div>`;

  Admin.$$('#tabs .tab').forEach((t) => t.addEventListener('click', () => {
    Admin.$$('#tabs .tab').forEach((x) => x.classList.toggle('active', x === t));
    st.status = t.dataset.s; st.page = 1; load();
  }));
  Admin.$('#kw').addEventListener('input', debounce((e) => { st.keyword = e.target.value.trim(); st.page = 1; load(); }, 300));
  Admin.$('#reload').addEventListener('click', load);

  async function refreshPending() {
    try {
      const r = await api(BASE + '/list', { query: { status: 'pending_review', pageSize: 1 }, raw: true, silent: true });
      Admin.$('#pendCnt').textContent = r.total;
      Admin.$('#pendCnt').style.display = r.total ? '' : 'none';
    } catch (e) { /* ignore */ }
  }

  async function load() {
    const r = await api(BASE + '/list', { query: { status: st.status, keyword: st.keyword, page: st.page, pageSize: st.pageSize }, raw: true });
    st.rows = r.data;
    draw(r.total);
    if (st.status === 'pending_review') { Admin.$('#pendCnt').textContent = r.total; Admin.$('#pendCnt').style.display = r.total ? '' : 'none'; }
    else refreshPending();
  }

  function draw(total) {
    const tbl = Admin.$('#tbl');
    if (!st.rows.length) {
      tbl.innerHTML = `<div class="empty-state">${st.status === 'pending_review' ? '没有待审核的退款，真清净 🎉' : '没有符合条件的退款记录'}</div>`;
      Admin.$('#pager').innerHTML = '';
      return;
    }
    tbl.innerHTML = `<table class="tbl"><thead><tr><th>退款单</th><th>用户</th><th>关联订单 / 投诉</th><th>金额</th><th>原因</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>
      ${st.rows.map((r) => {
        const s = STATUS[r.status] || [r.status, 'gray'];
        return `<tr>
          <td class="muted">#${r.id}</td>
          <td>${esc(r.nickname || '(未设置昵称)')}<div class="sm-text muted">#${r.user_id} · ${esc(r.dev_account || '')}</div></td>
          <td class="sm-text">${r.order_no ? '订单 ' + esc(r.order_no) : '-'}${r.complaint_id ? `<div class="muted">投诉#${r.complaint_id}</div>` : ''}</td>
          <td><b>${yuan(r.amount)}</b></td>
          <td class="sm-text" style="max-width:220px">${esc(r.reason || '-')}</td>
          <td>${badge(s[0], s[1])}${r.review_remark ? `<div class="sm-text muted">${esc(r.reviewer || '')}：${esc(r.review_remark)}</div>` : ''}</td>
          <td class="sm-text">申请：${esc(r.created_at || '')}${r.completed_at ? `<div class="muted">完成：${esc(r.completed_at)}</div>` : ''}</td>
          <td>${r.status === 'pending_review' ? `<div class="row-actions">
            <button class="btn sm primary" data-a="approve" data-id="${r.id}">通过</button>
            <button class="btn sm danger" data-a="reject" data-id="${r.id}">拒绝</button></div>` : '-'}</td>
        </tr>`;
      }).join('')}</tbody></table>`;
    Admin.$$('[data-a]', tbl).forEach((b) => b.addEventListener('click', () => {
      const r = st.rows.find((x) => x.id === Number(b.dataset.id));
      (b.dataset.a === 'approve' ? approve : reject)(r);
    }));
    renderPager(Admin.$('#pager'), { page: st.page, pageSize: st.pageSize, total }, (p) => { st.page = p; load(); });
  }

  async function approve(r) {
    const v = await formBox({
      title: `通过退款 #${r.id}`, width: 480, okText: '下一步：确认',
      fields: [
        { name: 'amount', label: '退款金额（元）', type: 'number', step: '0.01', min: 0.01, max: r.amount, required: true, value: r.amount, full: true,
          hint: `用户申请 ${yuan(r.amount)}。可改小做部分退款，不能超过申请金额。` },
        { name: 'remark', label: '审核备注（可选）', type: 'textarea', full: true, maxlength: 100, placeholder: '如：已核实，同意退款' }
      ],
      validate: (x) => {
        const a = Number(x.amount);
        if (!(a > 0)) return '退款金额必须大于 0';
        if (a > r.amount + 1e-9) return `退款金额不能超过申请金额 ${yuan(r.amount)}`;
        return '';
      }
    });
    if (!v) return;
    const amt = Math.round(Number(v.amount) * 100) / 100;
    const partial = Math.round(amt * 100) < Math.round(r.amount * 100);
    const ok = await confirmBox({
      title: '确认退款',
      message: `将退款 ${yuan(amt)} 到「${r.nickname || '用户#' + r.user_id}」的钱包。` +
        (partial ? `\n这是部分退款（申请 ${yuan(r.amount)}）：将按调整后的金额退款。` : '') + '\n确定继续吗？',
      okText: '确认退款'
    });
    if (!ok) return;
    try {
      await act(`${BASE}/${r.id}/review`, 'POST', { action: 'approve', amount: amt, review_remark: v.remark }, partial ? `已部分退款 ${yuan(amt)} 到用户钱包` : '退款已通过，已退回用户钱包');
    } catch (e) { load(); return; }
    ctx.refreshBadges();
    load();
  }

  async function reject(r) {
    const v = await formBox({
      title: `拒绝退款 #${r.id}`, width: 460, okText: '确认拒绝', danger: true,
      fields: [{ name: 'remark', label: '拒绝原因（会展示给用户）', type: 'textarea', required: true, full: true, maxlength: 100, placeholder: '如：商品已制作完成，不支持退款' }]
    });
    if (!v) return;
    const ok = await confirmBox({ title: '确认拒绝', message: `确定拒绝「${r.nickname || '用户#' + r.user_id}」${yuan(r.amount)} 的退款申请吗？`, danger: true, okText: '确认拒绝' });
    if (!ok) return;
    try { await act(`${BASE}/${r.id}/review`, 'POST', { action: 'reject', review_remark: v.remark }, '已拒绝该退款申请'); } catch (e) { return; }
    ctx.refreshBadges();
    load();
  }

  await load();
});
</script>
</body>
</html>
