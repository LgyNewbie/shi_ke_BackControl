<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留言管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'messages', title: '留言管理' }, async (main) => {
  const { api, act, esc, badge, modal, confirmBox, formBox, renderPager, debounce, $ } = Admin;
  const state = { page: 1, pageSize: 15, total: 0, keyword: '', status: '' };
  let all = [];   // 后端该接口一次返回全部，页面端做分页

  main.innerHTML = `
    <div class="toolbar">
      <input type="search" id="kw" placeholder="搜索留言内容 / 昵称 / 账号">
      <select id="st">
        <option value="">全部状态</option>
        <option value="normal">正常显示</option>
        <option value="hidden">已隐藏</option>
      </select>
      <button class="btn ghost" id="reload">刷新</button>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>ID</th><th>用户</th><th>留言内容</th><th class="num">点赞</th><th class="num">回复</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div id="pager"></div>`;

  const imgUrl = (u) => (String(u).startsWith('/') ? location.origin + u : u);
  const parseImgs = (v) => { if (Array.isArray(v)) return v; try { return JSON.parse(v || '[]'); } catch (e) { return []; } };
  const shortText = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };

  async function fetchAll() {
    all = await api('/api/admin/messages', { query: { keyword: state.keyword, status: state.status } });
    all = Array.isArray(all) ? all : [];
  }

  function render() {
    state.total = all.length;
    const maxPage = Math.max(1, Math.ceil(state.total / state.pageSize));
    if (state.page > maxPage) state.page = maxPage;
    const slice = all.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
    $('#tb').innerHTML = slice.length ? slice.map((m) => {
      const n = parseImgs(m.images).length;
      return `<tr>
        <td>${m.id}</td>
        <td>${esc(m.nickname || '用户')}<div class="muted sm-text">${esc(m.dev_account || '')}</div></td>
        <td style="max-width:360px"><div class="ellipsis" style="max-width:360px" title="${esc(m.content)}">${esc(shortText(m.content, 80))}</div>${n ? `<span class="muted sm-text">📷 ${n} 张图</span>` : ''}</td>
        <td class="num">${m.like_count}</td><td class="num">${m.comment_count}</td>
        <td>${m.status === 'hidden' ? badge('已隐藏', 'gray') : badge('正常', 'green')}</td>
        <td class="sm-text">${esc(m.created_at)}</td>
        <td><div class="row-actions">
          <button class="btn sm ghost" data-act="detail" data-id="${m.id}">详情</button>
          <button class="btn sm blue" data-act="reply" data-id="${m.id}">回复</button>
          <button class="btn sm warn" data-act="${m.status === 'hidden' ? 'show' : 'hide'}" data-id="${m.id}">${m.status === 'hidden' ? '恢复' : '隐藏'}</button>
          <button class="btn sm danger" data-act="del" data-id="${m.id}">删除</button>
        </div></td></tr>`;
    }).join('') : '<tr><td colspan="8" class="empty-state">暂无留言</td></tr>';
    renderPager($('#pager'), state, (p) => { state.page = p; render(); });
  }

  async function load() { await fetchAll(); render(); }

  async function reply(id) {
    const r = await formBox({
      title: `回复留言 #${id}`, okText: '发送回复', width: 480,
      fields: [{ name: 'content', label: '回复内容（以商家身份显示）', type: 'textarea', rows: 4, required: true, full: true, maxlength: 300 }],
      submit: (v) => act(`/api/admin/messages/${id}/comments`, 'POST', { content: v.content }, '回复成功')
    });
    return !!r;
  }
  async function setStatus(m, hide) {
    const ok = await confirmBox({
      title: hide ? '隐藏留言' : '恢复留言',
      message: hide ? '隐藏后用户端将不再显示这条留言，确定隐藏吗？' : '确定恢复显示这条留言吗？',
      okText: hide ? '确认隐藏' : '确认恢复', danger: hide
    });
    if (!ok) return false;
    await act(`/api/admin/messages/${m.id}/status`, 'POST', { status: hide ? 'hidden' : 'normal' });
    return true;
  }
  async function del(m) {
    const ok = await confirmBox({
      title: '删除留言',
      message: `确定永久删除留言 #${m.id} 吗？\n其点赞、回复会一并删除，且无法恢复。`,
      danger: true, okText: '确认删除'
    });
    if (!ok) return false;
    await act(`/api/admin/messages/${m.id}`, 'DELETE');
    return true;
  }

  async function detail(id) {
    const d = await api(`/api/admin/messages/${id}/detail`);
    const m = d.message;
    const imgs = parseImgs(m.images);
    const html = `
      <div class="detail-section">
        <div><b>${esc(m.nickname || '用户')}</b> <span class="muted sm-text">${esc(m.dev_account || '')} · ${esc(m.created_at)}</span>
          ${m.status === 'hidden' ? badge('已隐藏', 'gray') : badge('正常', 'green')}</div>
        <div class="pre" style="margin:8px 0">${esc(m.content)}</div>
        ${imgs.length ? `<div class="img-row">${imgs.map((u) => `<a href="${esc(imgUrl(u))}" target="_blank"><img src="${esc(imgUrl(u))}" alt=""></a>`).join('')}</div>` : ''}
        <div class="muted sm-text" style="margin-top:6px">👍 ${d.likeCount} · 💬 ${d.commentCount}</div>
      </div>
      <div class="detail-section"><h4>回复 / 评论（${d.comments.length}）</h4>
        ${d.comments.length ? d.comments.map((c) => `
          <div style="padding:8px 0;border-bottom:1px solid #f0f2f5;display:flex;gap:10px;justify-content:space-between">
            <div><b>${c.is_admin ? '商家' : esc(c.nickname || '用户')}</b>
              ${c.is_admin ? badge('官方', 'green') : ''} ${c.parent_id ? '<span class="muted sm-text">（回复 #' + c.parent_id + '）</span>' : ''}
              <span class="muted sm-text">${esc(c.created_at)}</span>
              <div class="pre">${esc(c.content)}</div></div>
            <button class="btn sm link danger" data-cdel="${c.id}">删除</button>
          </div>`).join('') : '<div class="muted">还没有回复</div>'}
      </div>`;
    const mm = modal({
      title: `留言详情 #${m.id}`, width: 640, body: html,
      buttons: [
        { text: '关闭', type: 'ghost' },
        { text: '回复', type: 'primary', keepOpen: true, onClick: async () => { if (await reply(id)) { mm.close(); detail(id); load(); } } }
      ]
    });
    mm.body.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-cdel]');
      if (!b) return;
      const ok = await confirmBox({ title: '删除回复', message: '确定删除这条回复吗？其下的子回复会一并删除。', danger: true, okText: '确认删除' });
      if (!ok) return;
      await act(`/api/admin/messages/comments/${b.dataset.cdel}`, 'DELETE');
      mm.close(); detail(id); load();
    });
  }

  $('#tb').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = Number(b.dataset.id);
    const m = all.find((x) => x.id === id);
    const a = b.dataset.act;
    if (a === 'detail') return detail(id);
    if (a === 'reply') { if (await reply(id)) load(); return; }
    if (!m) return;
    if (a === 'hide' || a === 'show') { if (await setStatus(m, a === 'hide')) load(); }
    if (a === 'del') { if (await del(m)) load(); }
  });
  $('#kw').addEventListener('input', debounce((e) => { state.keyword = e.target.value.trim(); state.page = 1; load(); }, 350));
  $('#st').addEventListener('change', (e) => { state.status = e.target.value; state.page = 1; load(); });
  $('#reload').addEventListener('click', load);
  await load();
});
</script>
</body>
</html>
