<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配送地址与区域</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'delivery', title: '配送地址 / 区域' }, async (body, ctx) => {
  const { api, act, esc, badge, confirmBox, formBox, debounce } = Admin;
  const BASE = '/api/admin/areas';
  let areas = [];
  let filter = { status: '', keyword: '' };

  ctx.setActions('<button class="btn primary" id="btnNew">+ 添加配送区域</button>');
  Admin.$('#btnNew').addEventListener('click', () => edit());

  body.innerHTML = `
    <div class="tip info">用户下单时只能在这里预设的区域中选择，再补充联系人、手机号和门牌号。「暂停配送」后用户无法再选择该区域；已有用户地址使用的区域不能删除，可先暂停。</div>
    <div class="toolbar">
      <select id="fStatus"><option value="">全部状态</option><option value="1">配送中</option><option value="0">已暂停</option></select>
      <input type="text" id="fKey" placeholder="搜索区域名称 / 地址">
      <span class="muted sm-text" id="summary"></span>
    </div>
    <div class="card" style="padding:0"><div class="table-wrap" id="tbl"></div></div>`;
  Admin.$('#fStatus').addEventListener('change', (e) => { filter.status = e.target.value; draw(); });
  Admin.$('#fKey').addEventListener('input', debounce((e) => { filter.keyword = e.target.value.trim().toLowerCase(); draw(); }, 200));

  async function load() { areas = await api(BASE); draw(); }

  function draw() {
    const on = areas.filter((a) => a.enabled).length;
    Admin.$('#summary').textContent = `共 ${areas.length} 个区域，配送中 ${on} 个，已暂停 ${areas.length - on} 个`;
    const rows = areas.filter((a) => (filter.status === '' || String(a.enabled ? 1 : 0) === filter.status) &&
      (!filter.keyword || (a.name + ' ' + (a.address || '')).toLowerCase().includes(filter.keyword)));
    const tbl = Admin.$('#tbl');
    if (!rows.length) { tbl.innerHTML = `<div class="empty-state">${areas.length ? '没有符合条件的区域' : '还没有配送区域，点右上角「添加配送区域」'}</div>`; return; }
    tbl.innerHTML = `<table class="tbl"><thead><tr><th>排序</th><th>区域名称</th><th>详细地址 / 取送点</th><th>说明</th><th>用户地址数</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${rows.map((a) => `<tr>
        <td class="muted">${a.sort_order}</td>
        <td><b>${esc(a.name)}</b></td>
        <td class="sm-text">${esc(a.address || '-')}</td>
        <td class="sm-text muted">${esc(a.description || '-')}</td>
        <td>${a.address_count}</td>
        <td>${a.enabled ? badge('配送中', 'green') : badge('已暂停', 'gray')}</td>
        <td><div class="row-actions">
          <button class="btn sm ghost" data-act="edit" data-id="${a.id}">编辑</button>
          <button class="btn sm ${a.enabled ? 'warn' : 'primary'}" data-act="toggle" data-id="${a.id}">${a.enabled ? '暂停配送' : '开启配送'}</button>
          <button class="btn sm danger" data-act="del" data-id="${a.id}">删除</button>
        </div></td></tr>`).join('')}</tbody></table>`;
    Admin.$$('[data-act]', tbl).forEach((b) => b.addEventListener('click', () => {
      const a = areas.find((x) => x.id === Number(b.dataset.id));
      ({ edit, toggle, del })[b.dataset.act](a);
    }));
  }

  async function edit(a) {
    const isEdit = !!(a && a.id);
    a = a || {};
    const r = await formBox({
      title: isEdit ? '编辑配送区域' : '添加配送区域',
      width: 520,
      fields: [
        { name: 'name', label: '区域名称', required: true, value: a.name, full: true, maxlength: 30, placeholder: '如：A栋宿舍楼 / 软件园一期' },
        { name: 'address', label: '详细地址 / 取送点（可选）', value: a.address, full: true, maxlength: 100, placeholder: '如：XX路88号一楼大厅' },
        { name: 'description', label: '说明（可选）', type: 'textarea', value: a.description, full: true, maxlength: 200, placeholder: '如：配送时间 11:00-13:30，送到楼下' },
        { name: 'sort_order', label: '排序（数字越小越靠前）', type: 'number', step: '1', value: a.sort_order || 0 }
      ],
      submit: async (v) => {
        const payload = { ...v, sort_order: Number(v.sort_order) || 0 };
        if (isEdit) await act(`${BASE}/${a.id}`, 'PUT', payload);
        else await act(BASE, 'POST', payload);
      }
    });
    if (r) load();
  }

  async function toggle(a) {
    const ok = await confirmBox({
      title: a.enabled ? '暂停配送' : '开启配送',
      message: a.enabled ? `确定暂停「${a.name}」的配送吗？暂停后用户无法再选择该区域下单（已有地址保留）。` : `确定开启「${a.name}」的配送吗？`,
      danger: !!a.enabled
    });
    if (!ok) return;
    await act(`${BASE}/${a.id}/toggle`, 'POST');
    load();
  }

  async function del(a) {
    const ok = await confirmBox({
      title: '删除配送区域',
      message: `确定删除「${a.name}」吗？此操作不可恢复。${a.address_count ? `\n注意：已有 ${a.address_count} 个用户地址使用该区域，系统将拒绝删除，请先暂停配送。` : ''}`,
      danger: true, okText: '确认删除'
    });
    if (!ok) return;
    await act(`${BASE}/${a.id}`, 'DELETE');
    load();
  }

  await load();
});
</script>
</body>
</html>
