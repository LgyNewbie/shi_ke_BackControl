<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单管理</title>
<link rel="stylesheet" href="style.css">
<style>
  .ord-items td { padding: 8px 10px; }
  .ord-items { width: 100%; border-collapse: collapse; }
  .ord-items th { text-align: left; font-size: 12px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .ord-items tr + tr td { border-top: 1px solid #f0f2f5; }
  .ord-items .num { text-align: right; }
  .old-price { text-decoration: line-through; color: var(--muted); font-size: 12px; margin-right: 4px; }
  .refund-box { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 10px 14px; }
  .detail-foot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'orders', title: '订单管理' }, async (body, ctx) => {
  const { esc, yuan, num, badge, $, $$ } = Admin;
  const qs = new URLSearchParams(location.search);
  const state = { status: qs.get('status') || '', refund: qs.get('refund') || '', keyword: '', type: '', page: 1, pageSize: 15, rows: [], counts: {} };

  const TABS = [
    ['', '全部', 'all'], ['pending', '待付款', 'pending'], ['paid', '待接单', 'paid'], ['accepted', '已接单', 'accepted'],
    ['cooking', '制作中', 'cooking'], ['delivery', '配送中', 'delivery'], ['ready', '待取餐', 'ready'],
    ['completed', '已完成', 'completed'], ['cancelled', '已取消', 'cancelled'], ['refunded', '已退款', 'refunded']
  ];
  const REFUND_TEXT = { pending: '退款审核中', partial: '部分退款', refunded: '已退款', rejected: '退款被驳回' };

  ctx.setActions('<button class="btn ghost" id="reloadBtn">刷新</button>');
  body.innerHTML = `
    <div class="tabs" id="tabs"></div>
    <div class="toolbar">
      <input type="text" id="kw" placeholder="搜索 订单号 / 用户昵称 / 手机号 / 商品 / 地址">
      <select id="fType"><option value="">全部配送方式</option><option value="delivery">配送到家</option><option value="pickup">到店自取</option></select>
      <label class="check"><input type="checkbox" id="fRefund"> 只看待审核退款</label>
      <button class="btn ghost" id="resetBtn">重置</button>
    </div>
    <div class="table-wrap"><table class="tbl"><thead><tr>
      <th>订单号</th><th>用户</th><th>商品</th><th>方式</th><th class="num">实付</th><th>状态</th><th>下单时间</th><th>操作</th>
    </tr></thead><tbody id="tb"></tbody></table></div>
    <div id="pager"></div>`;
  $('#fRefund').checked = state.refund === 'pending';

  function renderTabs() {
    const c = state.counts;
    $('#tabs').innerHTML = TABS.map(([v, t, k]) => {
      const n = c[k];
      return `<button class="tab ${!state.refund && state.status === v ? 'active' : ''}" data-s="${v}">${t}${n !== undefined ? `<span class="cnt">${n}</span>` : ''}</button>`;
    }).join('');
  }

  // 按状态给出商家可点的流转按钮
  function flowButtons(o) {
    if (o.refund_status === 'pending') return [];
    const out = [];
    if (o.status === 'paid') out.push({ a: 'accept', t: '接单', c: 'primary' });
    if (o.status === 'accepted') out.push({ a: 'cooking', t: '开始制作', c: 'primary' });
    if (o.status === 'cooking') out.push(o.delivery_type === 'pickup' ? { a: 'ready', t: '可取餐', c: 'primary' } : { a: 'delivery', t: '开始配送', c: 'primary' });
    if (o.status === 'delivery' || o.status === 'ready') out.push({ a: 'complete', t: '完成订单', c: 'primary' });
    return out;
  }
  const canCancel = (o) => ['pending', 'paid', 'accepted', 'cooking'].includes(o.status);
  const canDelete = (o) => o.status === 'cancelled' && o.payment_status === 'unpaid';
  const userName = (o) => (o.user && (o.user.nickname || o.user.dev_account)) || '未知用户';

  function statusBadge(o) {
    let h = badge(o.status_text, Admin.ORDER_COLORS[o.status] || 'gray');
    if (REFUND_TEXT[o.refund_status] && o.status !== 'refunded') h += ' ' + badge(REFUND_TEXT[o.refund_status], o.refund_status === 'pending' ? 'red' : 'orange');
    return h;
  }

  async function load() {
    const json = await Admin.api('/api/admin/orders', { raw: true, query: {
      status: state.refund ? '' : state.status, refund: state.refund, keyword: state.keyword, delivery_type: state.type,
      page: state.page, pageSize: state.pageSize } });
    state.rows = json.data; state.counts = json.counts || {};
    state.counts.refund_pending = state.counts.refund_pending || 0;
    renderTabs();
    $('#tb').innerHTML = json.data.map(o => `<tr>
      <td><div class="mono">${esc(o.order_no || '#' + o.id)}</div><div class="muted sm-text">#${o.id}</div></td>
      <td>${esc(userName(o))}<div class="muted sm-text">${esc((o.user && o.user.phone) || '')}</div></td>
      <td><div class="ellipsis" title="${esc(o.title)}">${esc(o.title)}</div><div class="muted sm-text">共 ${num(o.item_count)} 件</div></td>
      <td>${esc(o.delivery_type_text)}</td>
      <td class="num"><b>${yuan(o.amount)}</b><div class="muted sm-text">${esc(o.payment_method_text || '')}</div></td>
      <td>${statusBadge(o)}</td>
      <td class="muted sm">${esc(o.created_at)}</td>
      <td><div class="row-actions">
        <button class="btn sm ghost" data-a="detail" data-id="${o.id}">详情</button>
        ${flowButtons(o).map(b => `<button class="btn sm ${b.c}" data-a="${b.a}" data-id="${o.id}">${b.t}</button>`).join('')}
        ${canCancel(o) ? `<button class="btn sm ghost" style="color:var(--red)" data-a="cancel" data-id="${o.id}">取消</button>` : ''}
        ${canDelete(o) ? `<button class="btn sm ghost" style="color:var(--red)" data-a="del" data-id="${o.id}">删除</button>` : ''}
      </div></td></tr>`).join('') || '<tr><td colspan="8" class="empty-state">没有符合条件的订单</td></tr>';
    Admin.renderPager($('#pager'), { page: json.page, pageSize: json.pageSize, total: json.total }, (p) => { state.page = p; load(); });
    $('#fRefund').parentNode.lastChild.textContent = ` 只看待审核退款${state.counts.refund_pending ? `（${state.counts.refund_pending}）` : ''}`;
    ctx.refreshBadges && ctx.refreshBadges();
  }

  // ---------- 操作（全部先确认） ----------
  const FLOW_TEXT = {
    accept: ['接单', '确定接下这个订单吗？'],
    cooking: ['开始制作', '确定开始制作吗？'],
    ready: ['可取餐', '餐品已备好，通知用户到店取餐吗？'],
    delivery: ['开始配送', '确定开始配送吗？'],
    complete: ['完成订单', '确认订单已送达/已取走，标记为完成吗？']
  };
  async function flow(o, a) {
    const [t, msg] = FLOW_TEXT[a];
    if (!await Admin.confirmBox({ title: t, okText: '确认' + t, message: `订单 ${o.order_no || '#' + o.id}\n${msg}` })) return false;
    await Admin.act(`/api/admin/orders/${o.id}/${a}`, 'POST');
    return true;
  }
  async function cancel(o) {
    const hint = o.payment_status === 'paid' ? `订单已付款 ${yuan(o.amount)}，取消后将自动退回用户钱包。` : '订单尚未付款，取消后不会产生资金变动。';
    const v = await Admin.formBox({
      title: '取消订单 ' + (o.order_no || '#' + o.id), okText: '确认取消订单', danger: true, width: 440,
      fields: [{ name: 'reason', label: '取消原因（会展示给用户）', type: 'textarea', required: true, full: true, maxlength: 100, placeholder: '如：菜品售罄 / 超出配送范围', hint }],
      submit: async (val) => { await Admin.act(`/api/admin/orders/${o.id}/cancel`, 'POST', { reason: val.reason }); }
    });
    return !!v;
  }
  async function del(o) {
    if (!await Admin.confirmBox({ title: '删除订单', danger: true, okText: '确认删除', message: `确定删除订单 ${o.order_no || '#' + o.id} 吗？此操作不可恢复。` })) return false;
    await Admin.act('/api/admin/orders/' + o.id, 'DELETE');
    return true;
  }
  async function act(a, o) {
    try {
      let ok;
      if (FLOW_TEXT[a]) ok = await flow(o, a);
      else if (a === 'cancel') ok = await cancel(o);
      else if (a === 'del') ok = await del(o);
      return ok;
    } catch (e) { return false; }
  }

  // ---------- 详情 ----------
  async function showDetail(id) {
    const d = await Admin.api(`/api/admin/orders/${id}/detail`);
    const o = d.order, complaints = d.complaints || [], wallet = d.wallet || [];
    const addr = o.address;
    const tl = [
      ['下单', o.created_at], ['支付', o.paid_at], ['商家接单', o.accepted_at], ['开始制作', o.cooking_at],
      o.delivery_type === 'pickup' ? ['可取餐', o.ready_at] : ['开始配送', o.delivery_at],
      ['完成', o.completed_at], ['取消', o.cancelled_at], ['退款', o.refunded_at]
    ].filter(x => x[1]);
    const line = (l, v, cls) => `<div class="${cls || ''}"><span>${l}</span><span>${v}</span></div>`;
    const html = `
      <div class="detail-section"><dl class="kv">
        <dt>订单号</dt><dd class="mono">${esc(o.order_no)} <span class="muted">(#${o.id})</span></dd>
        <dt>状态</dt><dd>${statusBadge(o)}</dd>
        <dt>用户</dt><dd>${esc(userName(o))}${o.user && o.user.phone ? ' · ' + esc(o.user.phone) : ''}</dd>
        <dt>配送方式</dt><dd>${esc(o.delivery_type_text)}</dd>
        <dt>支付方式</dt><dd>${esc(o.payment_method_text || '-')} · ${esc(o.payment_status_text || '')}</dd>
        ${addr ? `<dt>收货信息</dt><dd>${esc(addr.name)} ${esc(addr.phone)}<br>${esc(addr.full || (addr.area_name || '') + (addr.detail || ''))}</dd>` : ''}
        <dt>用户备注</dt><dd>${esc(o.remark) || '<span class="muted">无</span>'}</dd>
        ${o.cancel_reason ? `<dt>取消原因</dt><dd>${esc(o.cancel_reason)}</dd>` : ''}
      </dl></div>
      <div class="detail-section"><h4>商品明细</h4>
        <table class="ord-items"><thead><tr><th>商品</th><th class="num">单价</th><th class="num">数量</th><th class="num">打包费</th><th class="num">配送费</th><th class="num">小计</th></tr></thead><tbody>
        ${o.items.map(i => `<tr><td><div class="cell-food">${i.image ? `<img class="thumb" src="${esc(i.image)}" alt="">` : '<div class="thumb"></div>'}<span>${esc(i.name)}</span></div></td>
          <td class="num">${i.discount_price < i.price ? `<span class="old-price">${yuan(i.price)}</span>` : ''}${yuan(i.discount_price)}</td>
          <td class="num">×${i.count}</td><td class="num">${yuan(i.packing_fee * i.count)}</td><td class="num">${yuan(i.delivery_fee * i.count)}</td><td class="num">${yuan(i.subtotal)}</td></tr>`).join('')}
        </tbody></table></div>
      <div class="detail-section"><h4>价格明细</h4><div class="price-lines">
        ${line('商品金额', yuan(o.goods_amount))}
        ${line('商品优惠', '-' + yuan(o.product_discount), 'minus')}
        ${line('优惠券' + (o.coupon ? `（${esc(o.coupon.name)}）` : ''), '-' + yuan(o.coupon_discount), 'minus')}
        ${line('打包费', '+' + yuan(o.packing_fee))}
        ${line('配送费', '+' + yuan(o.delivery_fee))}
        ${line('实付', yuan(o.amount), 'total')}
        ${o.refunded_amount > 0 ? line('已退款', yuan(o.refunded_amount), 'minus') : ''}
      </div></div>
      ${o.refund ? `<div class="detail-section"><h4>退款信息</h4><div class="refund-box"><dl class="kv">
        <dt>状态</dt><dd>${esc({ pending_review: '待审核', completed: '已退款', rejected: '已驳回' }[o.refund.status] || o.refund.status)}</dd>
        <dt>金额</dt><dd>${yuan(o.refund.amount)}</dd><dt>原因</dt><dd>${esc(o.refund.reason) || '-'}</dd>
        ${o.refund.review_remark ? `<dt>审核备注</dt><dd>${esc(o.refund.review_remark)}${o.refund.reviewer ? '（' + esc(o.refund.reviewer) + '）' : ''}</dd>` : ''}
        <dt>申请时间</dt><dd>${esc(o.refund.created_at)}</dd>${o.refund.completed_at ? `<dt>完成时间</dt><dd>${esc(o.refund.completed_at)}</dd>` : ''}
      </dl>${o.refund.status === 'pending_review' ? '<div style="margin-top:8px"><a href="refunds.html">前往「退款审核」处理 →</a></div>' : ''}</div></div>` : ''}
      <div class="detail-section"><h4>订单进度</h4><ul class="timeline">${tl.map(([t, v]) => `<li class="done">${t}<span class="t">${esc(v)}</span></li>`).join('')}</ul></div>
      ${wallet.length ? `<div class="detail-section"><h4>钱包流水</h4>${wallet.map(w => `<div class="sm-text" style="padding:3px 0">${esc(w.created_at)} · ${esc(w.remark || w.type)} · <b>${w.amount > 0 ? '+' : ''}${yuan(w.amount)}</b></div>`).join('')}</div>` : ''}
      <div class="detail-section"><h4>投诉记录（${complaints.length}）</h4>${complaints.map(c => `<div class="card" style="padding:10px 14px;margin-bottom:8px">
        <div>${badge(c.status, 'gray')} <b>${esc(c.type || '')}</b> <span class="muted sm-text">${esc(c.created_at)}</span></div><div class="pre">${esc(c.content)}</div>
        ${(c.images || []).length ? `<div class="img-row" style="margin-top:6px">${c.images.map(u => `<img src="${esc(u)}" onclick="window.open(this.src)">`).join('')}</div>` : ''}
        ${c.handle_remark ? `<div class="muted sm-text">处理备注：${esc(c.handle_remark)}</div>` : ''}</div>`).join('') || '<div class="muted">无</div>'}</div>`;

    const buttons = [];
    if (canDelete(o)) buttons.push({ text: '删除订单', type: 'danger', keepOpen: true, onClick: async (api) => { if (await act('del', o)) { api.close(); load(); } return false; } });
    if (canCancel(o)) buttons.push({ text: '取消订单', type: 'warn', keepOpen: true, onClick: async (api) => { if (await act('cancel', o)) { api.close(); load(); } return false; } });
    flowButtons(o).forEach(b => buttons.push({ text: b.t, type: 'primary', keepOpen: true, onClick: async (api) => { if (await act(b.a, o)) { api.close(); load(); } return false; } }));
    buttons.push({ text: '关闭', type: 'ghost' });
    if (o.refund_status === 'pending') buttons.unshift({ text: '有待审核退款，请先处理', type: 'ghost', keepOpen: true, onClick: () => false });
    Admin.modal({ title: '订单详情', width: 760, body: html, buttons });
  }

  // ---------- 事件 ----------
  body.addEventListener('click', async (e) => {
    const t = e.target.closest('.tab');
    if (t) { state.status = t.dataset.s; state.refund = ''; $('#fRefund').checked = false; state.page = 1; return load(); }
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const o = state.rows.find(x => x.id === Number(b.dataset.id));
    if (!o) return;
    try {
      if (b.dataset.a === 'detail') return await showDetail(o.id);
    } catch (err) { return; }
    if (await act(b.dataset.a, o)) await load();
  });
  $('#kw').addEventListener('input', Admin.debounce((e) => { state.keyword = e.target.value.trim(); state.page = 1; load(); }, 350));
  $('#fType').onchange = (e) => { state.type = e.target.value; state.page = 1; load(); };
  $('#fRefund').onchange = (e) => { state.refund = e.target.checked ? 'pending' : ''; state.page = 1; load(); };
  $('#resetBtn').onclick = () => { Object.assign(state, { status: '', refund: '', keyword: '', type: '', page: 1 }); $('#kw').value = ''; $('#fType').value = ''; $('#fRefund').checked = false; load(); };
  $('#reloadBtn').onclick = () => load();
  await load();
});
</script>
</body>
</html>
