<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分类管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'categories', title: '分类管理' }, async (body, ctx) => {
  const { esc, num } = Admin;
  ctx.setActions('<button class="btn primary" id="addBtn">+ 新增分类</button>');
  body.innerHTML = `
    <div class="tip info">分类按「排序值」从小到大显示在小程序点餐页。停用分类后，该分类下的菜品在小程序里不再显示。分类下还有菜品时不能删除。</div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>排序</th><th>分类名称</th><th>菜品数</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  let list = [];

  async function load() {
    list = await Admin.api('/api/admin/categories');
    const tb = document.getElementById('tb');
    tb.innerHTML = list.map(c => `
      <tr>
        <td>${num(c.sort_order)}</td>
        <td><b>${esc(c.name)}</b></td>
        <td>${num(c.food_count)} <a href="foods.html?category_id=${c.id}" class="sm-text">查看</a></td>
        <td>${Admin.badge(c.status === 'enabled' ? '启用中' : '已停用', c.status === 'enabled' ? 'green' : 'gray')}</td>
        <td class="muted sm">${esc(c.updated_at || c.created_at || '')}</td>
        <td><div class="row-actions">
          <button class="btn sm ghost" data-a="edit" data-id="${c.id}">编辑</button>
          <button class="btn sm ghost" data-a="toggle" data-id="${c.id}">${c.status === 'enabled' ? '停用' : '启用'}</button>
          <button class="btn sm ghost" style="color:var(--red)" data-a="del" data-id="${c.id}">删除</button>
        </div></td>
      </tr>`).join('') || '<tr><td colspan="6" class="empty-state">还没有分类，点右上角新增</td></tr>';
  }

  const fields = (c) => [
    { name: 'name', label: '分类名称', required: true, value: c ? c.name : '', maxlength: 20, full: true },
    { name: 'sort_order', label: '排序值', type: 'number', value: c ? c.sort_order : 0, hint: '数字越小越靠前', full: true }
  ];

  async function edit(c) {
    await Admin.formBox({
      title: c ? '编辑分类' : '新增分类', width: 420, fields: fields(c),
      submit: async (v) => {
        const data = { name: v.name, sort_order: Number(v.sort_order) || 0 };
        if (c) await Admin.act('/api/admin/categories/' + c.id, 'PUT', data, '分类已保存');
        else await Admin.act('/api/admin/categories', 'POST', data, '分类已添加');
      }
    });
    await load();
  }

  document.getElementById('addBtn').onclick = () => edit(null);
  body.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const c = list.find(x => x.id === Number(b.dataset.id));
    if (!c) return;
    try {
      if (b.dataset.a === 'edit') return edit(c);
      if (b.dataset.a === 'toggle') {
        const on = c.status === 'enabled';
        if (!await Admin.confirmBox({ title: on ? '停用分类' : '启用分类', danger: on, okText: on ? '确认停用' : '确认启用',
          message: on ? `停用「${c.name}」后，该分类下 ${c.food_count} 个菜品在小程序里将不再显示。确定停用吗？` : `确定启用「${c.name}」吗？` })) return;
        await Admin.act(`/api/admin/categories/${c.id}/toggle`, 'POST');
      } else if (b.dataset.a === 'del') {
        if (!await Admin.confirmBox({ title: '删除分类', danger: true, okText: '确认删除',
          message: `确定删除分类「${c.name}」吗？此操作不可恢复。` + (c.food_count ? `\n\n注意：该分类下还有 ${c.food_count} 个菜品，需要先移走才能删除。` : '') })) return;
        await Admin.act('/api/admin/categories/' + c.id, 'DELETE');
      }
      await load();
    } catch (err) { /* 已 toast */ }
  });
  await load();
});
</script>
</body>
</html>
