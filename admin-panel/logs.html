<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作日志</title>
<link rel="stylesheet" href="style.css">
<style>
  .log-detail { max-width: 320px; word-break: break-all; font-size: 12px; color: #52606d; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
Admin.init({ key: 'logs', title: '操作日志' }, async (body, ctx) => {
  const { api, act, esc, badge, confirmBox, formBox, renderPager, debounce, modal } = Admin;
  const f = { module: '', admin: '', result: '', keyword: '', from: '', to: '', page: 1, pageSize: 20 };

  ctx.setActions('<button class="btn danger" id="btnClear">清理旧日志</button>');
  Admin.$('#btnClear').addEventListener('click', clearLogs);

  body.innerHTML = `
    <div class="toolbar">
      <select id="fModule"><option value="">全部模块</option></select>
      <select id="fAdmin"><option value="">全部管理员</option></select>
      <select id="fResult"><option value="">全部结果</option><option value="success">成功</option><option value="fail">失败</option></select>
      <input type="text" id="fKey" placeholder="搜索动作 / 路径 / 详情 / 对象ID">
      <label class="sm-text muted">从 <input type="date" id="fFrom"></label>
      <label class="sm-text muted">到 <input type="date" id="fTo"></label>
      <button class="btn ghost" id="fReset">重置</button>
    </div>
    <div class="card" style="padding:0"><div class="table-wrap" id="tbl"></div></div>
    <div id="pager"></div>`;
  const bind = (id, k, ev) => Admin.$(id).addEventListener(ev || 'change', (e) => { f[k] = e.target.value.trim(); f.page = 1; load(); });
  bind('#fModule', 'module'); bind('#fAdmin', 'admin'); bind('#fResult', 'result'); bind('#fFrom', 'from'); bind('#fTo', 'to');
  Admin.$('#fKey').addEventListener('input', debounce((e) => { f.keyword = e.target.value.trim(); f.page = 1; load(); }, 300));
  Admin.$('#fReset').addEventListener('click', () => {
    Object.assign(f, { module: '', admin: '', result: '', keyword: '', from: '', to: '', page: 1 });
    ['#fModule', '#fAdmin', '#fResult', '#fKey', '#fFrom', '#fTo'].forEach((s) => { Admin.$(s).value = ''; });
    load();
  });

  const fillSelect = (sel, list, cur) => {
    const el = Admin.$(sel);
    const first = el.options[0].outerHTML;
    el.innerHTML = first + list.map((x) => `<option value="${esc(x)}">${esc(x)}</option>`).join('');
    el.value = cur;
  };

  let rows = [];
  async function load() {
    const r = await api('/api/admin/logs', { query: f, raw: true });
    rows = r.data;
    fillSelect('#fModule', r.modules || [], f.module);
    fillSelect('#fAdmin', r.admins || [], f.admin);
    const tbl = Admin.$('#tbl');
    if (!rows.length) { tbl.innerHTML = '<div class="empty-state">没有符合条件的日志</div>'; Admin.$('#pager').innerHTML = ''; return; }
    tbl.innerHTML = `<table class="tbl"><thead><tr><th>时间</th><th>管理员</th><th>模块</th><th>操作</th><th>对象</th><th>结果</th><th>请求</th><th>详情</th><th>IP</th></tr></thead><tbody>
      ${rows.map((l, i) => `<tr>
        <td class="sm-text">${esc(l.created_at)}</td>
        <td>${esc(l.admin_username)}</td>
        <td>${badge(l.module || '-', 'blue')}</td>
        <td><b>${esc(l.action)}</b></td>
        <td class="sm-text">${l.target ? '#' + esc(l.target) : '-'}</td>
        <td>${l.result === 'fail' ? badge('失败', 'red') : badge('成功', 'green')}</td>
        <td class="sm-text muted">${esc(l.method)} ${esc(l.path)}</td>
        <td><div class="log-detail">${esc((l.detail || '').slice(0, 80)) || '-'}${(l.detail || '').length > 80 ? ` <a href="#" data-i="${i}">查看全部</a>` : ''}</div></td>
        <td class="sm-text muted">${esc(l.ip || '')}</td></tr>`).join('')}</tbody></table>`;
    Admin.$$('[data-i]', tbl).forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault();
      const l = rows[Number(a.dataset.i)];
      modal({ title: `${l.action} · 请求详情`, width: 560, body: `<pre style="white-space:pre-wrap;word-break:break-all;font-size:13px">${esc(l.detail)}</pre>`, buttons: [{ text: '关闭', type: 'ghost' }] });
    }));
    renderPager(Admin.$('#pager'), { page: f.page, pageSize: f.pageSize, total: r.total }, (p) => { f.page = p; load(); });
  }

  async function clearLogs() {
    const v = await formBox({
      title: '清理旧日志', width: 440, okText: '下一步：确认', danger: true,
      fields: [{ name: 'days', label: '清理多少天以前的日志', type: 'number', min: 7, step: '1', required: true, value: 90, full: true, hint: '只会删除这个天数之前的记录，至少 7 天。' }],
      validate: (x) => (Math.floor(Number(x.days)) >= 7 ? '' : '只能清理 7 天以前的日志')
    });
    if (!v) return;
    const days = Math.floor(Number(v.days));
    const ok = await confirmBox({ title: '确认清理', message: `确定删除 ${days} 天前的全部操作日志吗？\n删除后无法恢复。`, danger: true, okText: '确认清理' });
    if (!ok) return;
    try { await act('/api/admin/logs/clear', 'POST', { days }); } catch (e) { return; }
    f.page = 1;
    load();
  }

  await load();
});
</script>
</body>
</html>
